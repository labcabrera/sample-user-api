apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-user-api
  labels:
    k8s-app: sample-user-api
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: sample-user-api
  template:
    metadata:
      labels:
        k8s-app: sample-user-api
    spec:
      imagePullSecrets:
      - name: registrykey
      containers:
      - name: sample-user-api
        image: labcabrera/sample-user-api:latest
        env:
        - name: TZ
          value: Europe/Madrid
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: sample-config
              key: log_level
        - name: JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: sample-config
              key: java_opts
        - name: FOO_SECRET
          valueFrom:
            secretKeyRef:
              name: sample-secret
              key: foo
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: web
          protocol: TCP
